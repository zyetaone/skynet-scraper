[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-scraper"
version = "1.0.0"
description = "SkyNet Scraper: free web search and page scraping as an MCP server for any AI coding agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Binae" }]
keywords = ["mcp", "scraping", "search", "botasaurus", "ai-agents", "skynet"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "botasaurus>=4.0.97",
  "beautifulsoup4>=4.11.2",
  "lxml>=5.2.2",
]

[project.urls]
Homepage = "https://github.com/zyetaone/skynet-scraper"
Repository = "https://github.com/zyetaone/skynet-scraper"
Issues = "https://github.com/zyetaone/skynet-scraper/issues"
Changelog = "https://github.com/zyetaone/skynet-scraper/blob/main/CHANGELOG.md"

[project.scripts]
skynet = "skynet_scraper.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
