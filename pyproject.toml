[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botasaurus-mcp"
version = "0.1.0"
description = "MCP server that gives any AI coding agent free web search and page scraping, via Botasaurus' anti-detect browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Binay Yadav" }]
keywords = ["mcp", "scraping", "search", "botasaurus", "ai-agents"]
dependencies = [
  "botasaurus>=4.0.97",
  "beautifulsoup4>=4.11.2",
  "lxml>=5.2.2",
]

[project.scripts]
botasaurus-mcp = "botasaurus_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
